server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # Auth & User Service
        - id: user-service-auth
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**, /api/users/**, /api/drivers/**, /api/admin/**

        # Location Service (REST API)
        - id: location-service
          uri: lb://location-service
          predicates:
            - Path=/api/locations/**

        # Trip Service
        - id: trip-service
          uri: lb://trip-service
          predicates:
            - Path=/api/trips/**

        # Matching Service
        - id: matching-service
          uri: lb://matching-service
          predicates:
            - Path=/api/matching/**

        # Rating Service
        - id: rating-service
          uri: lb://rating-service
          predicates:
            - Path=/api/ratings/**

        # Payment Service
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**

        # Real-time WebSocket Gateway Proxy
        - id: notification-websocket
          uri: lb:ws://notification-service
          predicates:
            - Path=/ws/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gatewayservice

