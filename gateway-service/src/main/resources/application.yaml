server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
          routes:
            - id: user-service-auth
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**, /api/users/**, /api/drivers/**, /api/admin/**
            - id: location-service
              uri: lb://location-service
              predicates:
                - Path=/api/locations/**
            - id: trip-service
              uri: lb://trip-service
              predicates:
                - Path=/api/trips/**
            - id: matching-service
              uri: lb://matching-service
              predicates:
                - Path=/api/matching/**
            - id: rating-service
              uri: lb://rating-service
              predicates:
                - Path=/api/ratings/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**
            - id: notification-websocket
              uri: lb:ws://notification-service
              predicates:
                - Path=/ws/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    gateway:
      enabled: true