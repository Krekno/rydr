spring:
  application:
    name: user-service
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: ${DB_USER_URL:jdbc:postgresql://localhost:5433/users}
    username: ${DB_USER_USERNAME:postgres}
    password: ${DB_USER_PASSWORD:postgres}
  config:
    import: "optional:configserver:"