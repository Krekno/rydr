spring:
  application:
    name: user-service
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: ${DB_USER_URL:jdbc:postgresql://localhost:5433/users}
    username: ${DB_USER_USERNAME:postgres}
    password: ${DB_USER_PASSWORD:postgres}
  config:
    import: "optional:configserver:"
  web:
    error:
      include-message: always
rsa:
  private-key: classpath:certs/private-key.pem
  public-key: classpath:certs/public-key.pem
server:
  port: 8000
logging:
  level:
    org:
      springframework:
        security: DEBUG